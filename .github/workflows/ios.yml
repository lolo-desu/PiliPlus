name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Typecheck native glass and PiP APIs
        run: |
          flutter precache --ios
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios15.0 \
            -F "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64" \
            ios/Runner/LiquidGlassView.swift ios/Runner/DanmakuPictureInPicture.swift

      - name: Analyze iOS changes
        run: dart analyze --fatal-infos lib/utils/ios lib/common/widgets/ios_glass_surface.dart lib/utils/theme_utils.dart lib/pages/danmaku/controller.dart

      - name: Test PiP comment synchronization and filtering
        run: flutter test --no-pub test/ios_pip_comments_test.dart

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # No certificate, profile or ad-hoc signing: user signs all nested code.
          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          zip -r9 PiliPlus_ios_glass_unsigned_${{env.version}}.ipa Payload
          unzip -t PiliPlus_ios_glass_unsigned_${{env.version}}.ipa

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_glass_unsigned_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          name: iOS-glass-unsigned
          path: PiliPlus_ios_glass_unsigned_*.ipa
